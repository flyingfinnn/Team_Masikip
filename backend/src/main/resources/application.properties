# Blockfrost Cardano Preview Configuration
blockfrost.project.id=previewVtdGxJsb2gej7pQ0EyKXHiKnFXnnOt9a
blockfrost.api.url=https://cardano-preview.blockfrost.io/api/v0

# IPFS Gateway
ipfs.gateway.url=https://ipfs.blockfrost.dev/ipfs/

# Request Body Size Limits (for large notes)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-post-size=50MB